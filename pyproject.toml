[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-data-lifecycle-atlas"
version = "1.2.1"
description = "Executable lifecycle documentation for scientific data platforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.18,<5",
  "pytest>=8,<9",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

name: scientific-data-lifecycle-atlas

services:
  atlas:
    image: scientific-data-lifecycle-atlas:1.2.0
    build:
      context: .
    ports:
      - "${ATLAS_BIND_ADDRESS:-127.0.0.1}:${ATLAS_PORT:-8000}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
